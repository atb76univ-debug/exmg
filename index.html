<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groove iPad Recorder</title><style>body{font:16px -apple-system;margin:auto;max-width:760px;padding:18px;background:#10232d;color:#eef}section{padding:16px;margin:14px 0;background:#1d3542;border-radius:12px}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;margin-top:4px}input,select{width:100%;box-sizing:border-box}button{margin:4px;background:#1fa879;color:#fff;border:0;border-radius:7px}button:disabled{opacity:.45}video{width:100%;max-height:50vh;background:#000}#rec{color:#ff7b82;font-weight:bold}.item{border-top:1px solid #668;padding:10px 0}</style><body><h1>Groove iPad Recorder</h1><p>録画・音源再生・試行進行をiPadだけで実行</p><video id="v" playsinline muted autoplay></video><p id="rec"></p>
<section><h2>実験設定</h2><label>実験者ID<input id="e"></label><label>参加者ID<input id="p"></label><label>課題順<select id="o"><option value="a">腕振り → 自由身体運動</option><option value="f">自由身体運動 → 腕振り</option></select></label><label>休憩秒数<input id="rest" type="number" value="20" min="0"></label><h3>刺激音源（低・中・高を各3つ）</h3><div id="files"></div><button id="prepare">9音源を確認して試行順を作成</button><button id="camera" disabled>カメラを開始</button><p id="status">9つの音源を選択してください。</p></section>
<section><h2>実験実行</h2><p id="trial">試行順未作成</p><button id="start" disabled>最初の試行を開始</button><button id="block" disabled>次の課題ブロックを開始</button><p>録画開始→200フレーム後に音源再生→音源終了で録画停止・保存→休憩→次試行。課題間のみ手動です。</p></section>
<section><h2>iPad内のデータ</h2><p>試行ごとにiPad内へ保存されます。終了後に「ファイルに保存」から動画とJSONを取り出します。</p><div id="list"></div></section><script src="app.js"></script></body></html>
