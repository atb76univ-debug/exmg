<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groove iPad Recorder</title><style>body{font:16px -apple-system;margin:auto;max-width:780px;padding:16px;background:#102934;color:#eff}section{background:#1b3948;padding:14px;margin:14px 0;border-radius:12px}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:8px;margin-top:3px}input,select{width:100%;box-sizing:border-box}button{background:#14a779;color:white;border:0;border-radius:7px;margin:4px}button:disabled{opacity:.5}video{width:100%;max-height:55vh;background:#000}.item{border-top:1px solid #678;padding:10px 0}.note{color:#c4d4da}</style><body><h1>Groove iPad Recorder</h1><p>iPad内で録画・音源再生・実験自動進行</p><video id="v" playsinline muted autoplay></video><p id="recording"></p>
<section><h2>実験設定</h2><label>実験者ID<input id="experimenter"></label><label>参加者ID<input id="participant"></label><label>課題順<select id="order"><option value="arm">腕振り → 自由身体運動</option><option value="free">自由身体運動 → 腕振り</option></select></label><label>試行間休憩（秒）<input id="rest" type="number" value="20" min="0"></label><h3>刺激音源（低・中・高を各3つ）</h3><div id="soundInputs"></div><button id="prepare">9音源を確認して試行順を作成</button><button id="camera" disabled>カメラ・マイクを開始</button><p id="status">9つの音源を選択してください。</p></section>
<section><h2>実験実行</h2><p id="trial">試行順未作成</p><button id="start" disabled>最初の試行を開始</button><button id="block" disabled>次の課題ブロックを開始</button><p class="note">録画開始 → 200フレーム後に音源再生 → 音源終了で録画停止・保存 → 休憩 → 次試行。課題間だけ手動です。</p></section>
<section><h2>保存・クラウド同期</h2><p class="note">動画はマイク音声を含み、試行ごとにiPad内へ保存されます。</p><button id="exportAll">全試行をCSV＋動画で一括ダウンロード</button><p class="note">共有シートで「ファイルに保存」→「iCloud Drive」を選ぶと、iCloud同期できます。</p><div id="records"></div></section><script src="app.js"></script>
