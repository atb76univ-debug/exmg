<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12313f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>実験用アプリ</title>
</head>
<body>
  <main>
    <h1>実験用アプリ</h1>
    <p>キャリブレーションと課題(9試行)を実行</p>
    <section class="preview"><video id="preview" playsinline muted autoplay></video><p id="previewText">カメラを開始</p><b id="rec" hidden>● REC <span id="time">00:00</span></b></section>
    <section>
      <h2>実験設定</h2>
      <label>実験者ID<input id="experimenter" placeholder="E001"></label>
      <label>参加者ID<input id="participant" placeholder="a101"></label>
      <label>課題<select id="task"><option>腕振り</option><option>自由身体運動</option></select></label>
      <label>試行間休憩（秒）<input id="rest" type="number" min="0" value="20"></label>
      <label>1試行目開始までの待機（秒）<input id="leadIn" type="number" min="0" value="60"></label>
      <h3>刺激音源（低・中・高を各3つ）</h3>
      <p>音源を選択</p>
      <div id="sounds"></div>
      <button id="prepare">9音源を確認して試行順を作成</button><button id="camera" disabled>カメラ・マイクを開始</button>
      <p id="status">IDと9音源を設定してください。</p>
    </section>
    <section>
      <h2>キャリブレーション</h2>
      <label>BPM<input id="bpm" type="number" min="30" max="240" value="120"></label>
      <p>4拍×8小節（32拍）のメトロノームに合わせて腕を振る。</p>
      <button id="calibrate" disabled>キャリブレーションを開始</button>
    </section>
    <section>
      <h2>9試行</h2><p id="progress">試行順は未作成です。</p><button id="start" disabled>9試行を開始</button>
    </section>
    <section>
      <h2>記録</h2>
      <label>書き出す参加者<select id="exportParticipant"></select></label>
      <button id="export" disabled>この参加者のCSV＋動画を一括保存</button>
      <p></p><div id="archive"></div
    </section>
  </main><script src="app.js"></script>
</body>
</html>
